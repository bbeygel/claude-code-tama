name: Bug
description: Something in Tama doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Claude Code version (`claude --version`)
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal app (e.g. Ghostty, iTerm2, Terminal.app, tmux)
    validations:
      required: true
